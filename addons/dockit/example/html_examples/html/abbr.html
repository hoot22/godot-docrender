<!DOCTYPE html>

<style>
    abbr {
        font-style: italic;
        color: chocolate;
    }
</style>

<html>
<p>
    You can use <abbr>CSS</abbr> (Cascading Style Sheets) to add styles to <abbr>HTML</abbr> (HyperText Markup
    Language). With stylesheets, you can separate the <abbr>CSS</abbr> presentation layer from the <abbr>HTML</abbr>
    content layer, and this design pattern is called 'separation of concerns'.
</p>

</html>
